name: ${WIKI_DEPLOYMENT_NAME:-investment-research-wiki}
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: gbrain
      POSTGRES_USER: gbrain
      POSTGRES_PASSWORD: ${GBRAIN_PG_PASSWORD:?Run scripts/setup.ps1 first}
    ports: ["127.0.0.1:${WIKI_PG_PORT:-5436}:5432"]
    volumes: ["${WIKI_DATA_ROOT:-D:/data/researchwiki-investment}/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbrain -d gbrain"]
      interval: 5s
      timeout: 5s
      retries: 20
  embeddings:
    image: ollama/ollama:0.17.0
    restart: unless-stopped
    ports: ["127.0.0.1:${WIKI_OLLAMA_PORT:-11435}:11434"]
    volumes: ["${WIKI_DATA_ROOT:-D:/data/researchwiki-investment}/models/ollama:/root/.ollama"]
    environment:
      OLLAMA_KEEP_ALIVE: 2h
      OLLAMA_MAX_LOADED_MODELS: 1
